<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <title>Astro Camera Control</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
</head>
<body>
    <div class="container">
        <!-- Header -->
        <header>
            <h1>Astro Camera</h1>
            <div class="status-indicator">
                <span class="status-dot" id="status-dot"></span>
                <span id="status-text">Connected</span>
            </div>
        </header>

        <!-- Video Preview -->
        <section class="video-section">
            <div class="video-container">
                <img src="/video_feed" alt="Camera Preview" id="video-feed" class="video-feed">
                <div class="video-overlay" id="loading-overlay">
                    <div class="spinner"></div>
                    <p>Loading preview...</p>
                </div>
            </div>
        </section>

        <!-- Camera Controls -->
        <section class="controls-section">
            <h2>Camera Settings</h2>

            <!-- ISO Control -->
            <div class="control-group">
                <label for="iso-select">ISO</label>
                <select id="iso-select" class="control-select">
                    <option value="0">Loading...</option>
                </select>
            </div>

            <!-- Shutter Speed Control -->
            <div class="control-group">
                <label for="shutter-select">Shutter Speed (s)</label>
                <select id="shutter-select" class="control-select">
                    <option value="0">Loading...</option>
                </select>
            </div>

            <!-- Output Format Control -->
            <div class="control-group">
                <label for="output-select">Output Format</label>
                <select id="output-select" class="control-select">
                    <option value="0">Loading...</option>
                </select>
            </div>

            <!-- Image Time Control -->
            <div class="control-group">
                <label for="image-time-select">Image Time (s)</label>
                <select id="image-time-select" class="control-select">
                    <option value="0">Loading...</option>
                </select>
            </div>

            <!-- Image Count Control -->
            <div class="control-group">
                <label for="image-count-select">Image Count</label>
                <select id="image-count-select" class="control-select">
                    <option value="0">Loading...</option>
                </select>
            </div>
        </section>

        <!-- Capture Button -->
        <section class="action-section">
            <button id="capture-btn" class="btn-primary">
                <svg class="btn-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor">
                    <circle cx="12" cy="12" r="3"></circle>
                    <path d="M3 9h18"></path>
                    <path d="M9 21h6"></path>
                    <rect x="3" y="9" width="18" height="12" rx="2"></rect>
                </svg>
                <span id="capture-text">Start Capture</span>
            </button>

            <div class="capture-status" id="capture-status"></div>
        </section>

        <!-- Footer Info -->
        <footer>
            <p class="info-text">Connect to: <strong>AstroCamera</strong> WiFi</p>
            <p class="info-text">Access at: <strong>http://192.168.50.1:5000</strong></p>
        </footer>
    </div>

    <script src="{{ url_for('static', filename='js/app.js') }}"></script>
</body>
</html>
